name: Deploy Frontend to ahost.uz

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Поддомен (пусто = artez.uz, saas-test = saas-test.artez.uz)'
        required: false
        default: ''
      api_url:
        description: 'API URL для этого клиента'
        required: false
        default: 'https://web-production-eef2a.up.railway.app'
      company_name:
        description: 'Название компании'
        required: false
        default: 'ARTEZ'
      company_slug:
        description: 'Slug компании (для регистрации/входа клиентов сайта — company_id на бэкенде)'
        required: false
        default: 'artez'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.subdomain || 'cleano' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Generate config.js
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          INPUT_CO_NAME: ${{ github.event.inputs.company_name }}
          INPUT_CO_SLUG: ${{ github.event.inputs.company_slug }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            API_URL="https://web-production-eef2a.up.railway.app"
            CO_NAME="ARTEZ"
            CO_SLUG="artez"
          else
            API_URL="$INPUT_API_URL"
            CO_NAME="$INPUT_CO_NAME"
            CO_SLUG="$INPUT_CO_SLUG"
          fi
          printf 'window.APP_COMPANY_NAME = "%s";\nwindow.APP_API_URL      = "%s";\nwindow.APP_COMPANY_SLUG = "%s";\n' \
            "$CO_NAME" "$API_URL" "$CO_SLUG" > config.js
          echo "Generated config.js:"
          cat config.js

      - name: Validate subdomain (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_SUB: ${{ github.event.inputs.subdomain }}
        run: |
          if [ -z "$INPUT_SUB" ]; then
            echo "ERROR: subdomain не может быть пустым. Укажите поддомен (например: saas-test, client1)."
            exit 1
          fi

      - name: Swap in platform landing page (cleano.uz only)
        if: github.event.inputs.subdomain == 'cleano' || github.event_name == 'push'
        run: |
          echo "Замена index.html на лендинг платформы cleano-landing.html"
          cp cleano-landing.html index.html

      - name: Cache-bust config.js and site-common.js (30-дневный Cache-Control на хостинге игнорирует .htaccess)
        run: |
          TS=$(date +%s)
          find . -maxdepth 1 -name "*.html" -exec sed -i "s/config\.js\"/config.js?v=${TS}\"/g" {} \;
          # site-common.js раньше версионировался вручную (site-common.js?v=22 в исходниках) —
          # легко забыть бампнуть после правки самого файла, тогда хостинг продолжает отдавать
          # старую закэшированную версию до 30 дней. Теперь версия всегда свежая при каждом деплое.
          find . -maxdepth 1 -name "*.html" -exec sed -i -E "s/site-common\.js(\?v=[0-9]+)?\"/site-common.js?v=${TS}\"/g" {} \;
          echo "config.js and site-common.js references bumped to ?v=${TS}"

      - name: Set FTP credentials and path
        id: cfg
        run: |
          echo "ftp_user=${{ secrets.FTP_USERNAME_SAAS }}" >> $GITHUB_OUTPUT
          echo "ftp_pass=${{ secrets.FTP_PASSWORD_SAAS }}" >> $GITHUB_OUTPUT
          echo "ftp_path=/"                                >> $GITHUB_OUTPUT

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ steps.cfg.outputs.ftp_user }}
          FTP_PASS: ${{ steps.cfg.outputs.ftp_pass }}
          DEPLOY_PATH: ${{ steps.cfg.outputs.ftp_path }}
        run: |
          cat > /tmp/deploy.lftp << EOF
          set ftp:ssl-allow no
          set net:timeout 60
          set net:max-retries 3
          mirror --reverse --no-perms --parallel=4 --transfer-all --verbose --exclude-glob=.git/ --exclude-glob=.github/ --exclude-glob=*.md --exclude-glob=.gitignore . ${DEPLOY_PATH}
          put config.js -o ${DEPLOY_PATH}config.js
          bye
          EOF
          echo "=== lftp script ==="
          cat /tmp/deploy.lftp
          echo "=== config.js content ==="
          cat config.js
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" < /tmp/deploy.lftp
