<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База знаний — Cleano</title>
<link rel="icon" href="data:,">
<script src="config.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --surface2: #222536;
    --border:   #2e3250;
    --accent:   #f5a623;
    --text:     #e8eaf0;
    --text2:    #9ca3af;
    --radius:   10px;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif, 'Segoe UI Emoji', 'Noto Color Emoji', 'Apple Color Emoji';
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .kb-header {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .kb-header .title { font-size: 17px; font-weight: 700; flex: 1; }
  .kb-header .back { color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 600; padding: 7px 12px; border: 1.5px solid var(--border); border-radius: 8px; }
  .kb-header .back:hover { color: var(--text); border-color: var(--accent); }
  .kb-langbtn { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; }
  .kb-langbtn.active { background: var(--accent); color: #1a1200; border-color: var(--accent); }
  .kb-layout { display: flex; max-width: 1200px; margin: 0 auto; min-height: calc(100vh - 57px); }
  .kb-sidebar { width: 280px; flex-shrink: 0; padding: 18px 12px; border-right: 1px solid var(--border); }
  @media (max-width: 760px) { .kb-layout { flex-direction: column; } .kb-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); } }
  .kb-cat { margin-bottom: 4px; }
  .kb-cat-title { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; user-select: none; }
  .kb-cat-title:hover { background: var(--surface); }
  .kb-cat-arts { display: none; padding-left: 12px; }
  .kb-cat.open .kb-cat-arts { display: block; }
  .kb-cat.open .kb-cat-arrow { transform: rotate(90deg); }
  .kb-cat-arrow { transition: transform .15s; font-size: 11px; color: var(--text2); }
  .kb-art-link { display: block; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--text2); cursor: pointer; text-decoration: none; }
  .kb-art-link:hover { background: var(--surface); color: var(--text); }
  .kb-art-link.active { background: var(--surface2); color: var(--accent); font-weight: 600; }
  .kb-content { flex: 1; padding: 24px 28px; min-width: 0; }
  .kb-content h1 { font-size: 22px; margin-bottom: 16px; }
  .kb-content h3 { font-size: 16px; margin: 20px 0 8px; color: var(--accent); }
  .kb-content p { font-size: 14px; line-height: 1.65; color: var(--text); margin-bottom: 10px; white-space: pre-wrap; }
  .kb-content img, .kb-content video { max-width: 100%; border-radius: var(--radius); margin: 10px 0; border: 1px solid var(--border); display: block; }
  .kb-empty { color: var(--text2); font-size: 14px; padding: 40px 0; text-align: center; }
  .kb-loading { color: var(--text2); font-size: 13px; padding: 12px; }
</style>
</head>
<body>
  <div class="kb-header">
    <a class="back" href="admin.html" id="backLink">← Назад</a>
    <div class="title">📚 База знаний</div>
    <button class="kb-langbtn" id="langRu" onclick="setLang('ru')">RU</button>
    <button class="kb-langbtn" id="langUz" onclick="setLang('uz')">UZ</button>
  </div>
  <div class="kb-layout">
    <div class="kb-sidebar" id="kbSidebar"><div class="kb-loading">Загрузка…</div></div>
    <div class="kb-content" id="kbContent"><div class="kb-empty">Выберите статью слева</div></div>
  </div>

<script>
  const TOKEN_KEY = 'artez_admin_token';
  const token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem('staff_token') || '';
  if (!token) { location.href = 'admin.html'; }
  const API_BASE = (window.APP_API_URL || 'https://web-production-eef2a.up.railway.app') + '/api';
  let lang = localStorage.getItem('admin_lang') || 'ru';
  let _categories = [];

  function _esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function _escAttr(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function setLang(l) {
    lang = l;
    localStorage.setItem('admin_lang', l);
    _syncLangBtns();
    renderSidebar();
    const openSlug = new URLSearchParams(location.search).get('article');
    if (openSlug) openArticle(openSlug); else document.getElementById('kbContent').innerHTML = '<div class="kb-empty">Выберите статью слева</div>';
  }
  function _syncLangBtns() {
    document.getElementById('langRu').classList.toggle('active', lang === 'ru');
    document.getElementById('langUz').classList.toggle('active', lang === 'uz');
  }

  async function apiGet(path) {
    const r = await fetch(`${API_BASE}${path}`, { headers: { Authorization: `Bearer ${token}` } });
    if (r.status === 401) { location.href = 'admin.html'; throw new Error('401'); }
    return r.json();
  }

  function renderSidebar() {
    const el = document.getElementById('kbSidebar');
    if (!_categories.length) { el.innerHTML = '<div class="kb-empty">Пока пусто</div>'; return; }
    const activeSlug = new URLSearchParams(location.search).get('article');
    el.innerHTML = _categories.map((c, i) => {
      const hasActive = c.articles.some(a => a.slug === activeSlug);
      return `
      <div class="kb-cat ${hasActive ? 'open' : ''}" id="kbCat${i}">
        <div class="kb-cat-title" onclick="toggleCat(${i})">
          <span>${c.icon || '📄'}</span>
          <span style="flex:1">${_esc(lang === 'uz' ? c.title_uz : c.title_ru)}</span>
          <span class="kb-cat-arrow">▸</span>
        </div>
        <div class="kb-cat-arts">
          ${c.articles.map(a => `<a class="kb-art-link ${a.slug === activeSlug ? 'active' : ''}" data-slug="${_escAttr(a.slug)}" href="?article=${encodeURIComponent(a.slug)}">${_esc(lang === 'uz' ? a.title_uz : a.title_ru)}</a>`).join('') || '<div class="kb-loading">Нет статей</div>'}
        </div>
      </div>`;
    }).join('');
  }
  function toggleCat(i) {
    document.getElementById('kbCat' + i).classList.toggle('open');
  }

  function renderBlock(b) {
    if (b.type === 'heading') return `<h3>${_esc(b.text)}</h3>`;
    if (b.type === 'text') return `<p>${_esc(b.text)}</p>`;
    if (b.type === 'image') return `<img data-kb-media="${encodeURIComponent(b.file_id)}" loading="lazy">`;
    if (b.type === 'video') return `<video controls preload="metadata" data-kb-media="${encodeURIComponent(b.file_id)}"></video>`;
    return '';
  }

  let _kbObjectUrls = [];
  async function _loadKbMedia(container) {
    _kbObjectUrls.forEach(u => URL.revokeObjectURL(u));
    _kbObjectUrls = [];
    const els = container.querySelectorAll('[data-kb-media]');
    for (const el of els) {
      const fileId = decodeURIComponent(el.getAttribute('data-kb-media'));
      try {
        const r = await fetch(`${API_BASE}/kb/media/${encodeURIComponent(fileId)}`, { headers: { Authorization: `Bearer ${token}` } });
        if (!r.ok) continue;
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        _kbObjectUrls.push(url);
        el.src = url;
      } catch (e) {}
    }
  }

  async function openArticle(slug) {
    history.replaceState(null, '', '?article=' + encodeURIComponent(slug));
    const content = document.getElementById('kbContent');
    content.innerHTML = '<div class="kb-loading">Загрузка…</div>';
    try {
      const d = await apiGet(`/kb/articles/${encodeURIComponent(slug)}`);
      const a = d.article;
      const title = lang === 'uz' ? a.title_uz : a.title_ru;
      let blocks = [];
      try { blocks = JSON.parse((lang === 'uz' ? a.body_uz : a.body_ru) || '[]'); } catch (e) { blocks = []; }
      content.innerHTML = `<h1>${_esc(title)}</h1>` + (blocks.map(renderBlock).join('') || '<div class="kb-empty">Статья пока пустая</div>');
      _loadKbMedia(content);
    } catch (e) {
      content.innerHTML = '<div class="kb-empty">Статья не найдена</div>';
    }
    renderSidebar();
  }

  (function(){
    const slug = new URLSearchParams(location.search).get('company_slug');
    if (slug) document.getElementById('backLink').href = 'admin.html?company_slug=' + encodeURIComponent(slug);
  })();

  document.getElementById('kbSidebar').addEventListener('click', (e) => {
    const a = e.target.closest('.kb-art-link');
    if (!a) return;
    e.preventDefault();
    openArticle(a.dataset.slug);
  });

  async function init() {
    _syncLangBtns();
    try {
      const d = await apiGet('/kb/categories');
      _categories = d.categories || [];
    } catch (e) {
      _categories = [];
    }
    renderSidebar();
    const openSlug = new URLSearchParams(location.search).get('article');
    if (openSlug) openArticle(openSlug);
  }
  init();
</script>
</body>
</html>
